name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test --no-parallel
      - name: Check experimental SNES launcher host fixtures
        working-directory: tools/snes-compatibility-launch/experimental-console
        run: |
          sh check-console-entry-integration.sh
          sh check-stock-gameplay.sh
          sh check-stock-gameplay-transition.sh
          sh check-stock-gameplay-image-order.sh
